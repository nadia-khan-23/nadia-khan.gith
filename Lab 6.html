<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script> <!-- Link to JavaScript file -->
</head>
<body>
    <header>
        <h1>Nadia Khan's Contact Form </h1>
    </header>
    
    <!-- Contact Form -->
    <form id="contactForm">
        <!-- Fieldset groups related elements, with a legend for the form section title -->
        <fieldset>
            <legend>Contact Information</legend>
    
            <!-- Text input for name -->
            <p>
                <label for="username">Name:</label>
                <input type="text" id="username" name="username" required>
            </p>
    
            <!-- Email input field -->
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>
    
            <!-- Select dropdown for topic of inquiry -->
            <p>
                <label for="topic">Topic of Inquiry:</label>
                <select id="topic" name="topic">
                    <option value="general">General Inquiry</option>
                    <option value="support">Support</option>
                    <option value="feedback">Feedback</option>
                </select>
            </p>
    
            <!-- Datalist for suggested cities (with predefined options) -->
            <p>
                <label for="city">City:</label>
                <input list="city-list" id="city" name="city" placeholder="Type to search">
                <datalist id="city-list">
                    <option value="New York">
                    <option value="Los Angeles">
                    <option value="Chicago">
                    <option value="Houston">
                    <option value="Phoenix">
                </datalist>
            </p>
    
            <!-- Textarea for detailed message -->
            <p>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" cols="50"></textarea>
            </p>
    
            <!-- Range input with output for rating satisfaction level -->
            <p>
                <label for="satisfaction">Satisfaction Level:</label>
                <input type="range" id="satisfaction" name="satisfaction" min="0" max="10" oninput="output.value = satisfaction.value">
                <output id="output">5</output>
            </p>
    
            <!-- Submit button for form submission -->
            <p>
                <button type="submit">Submit</button>
            </p>
        </fieldset>
    </form>    

    <footer>
        <p>Thank you for visiting Nadia's Lab 6 Submission! 
            
            We hope you give a good grade! </p>
    </footer>
</body>
</html>
